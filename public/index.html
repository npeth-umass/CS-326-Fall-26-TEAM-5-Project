<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Congressional Stock Watch</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
    }

    /* Top nav bar */
    nav {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2rem;
      background: #0f2a4a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .brand {
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
    }
    .links {
      display: flex;
      gap: 0.5rem;
    }
    .links a {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .links a:hover {
      background: #1d4ed8;
      color: #fff;
    }

    /* Page content */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #0f2a4a;
    }
    main p {
      font-size: 1.1rem;
      color: #4b5563;
    }

    /* Stack the bar on small screens */
    @media (max-width: 520px) {
      nav {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">Congressional Stock Watch</a>
    <div class="links">
      <a href="/details">Details</a>
      <a href="/trades">Trades</a>
      <a href="/politicians">Politicians</a>
    </div>
  </nav>

  <main>
    <h1>Congressional Stock Watch</h1>
    <p>Comparing Congress members' stock trades to their votes.</p>
  </main>
</body>
</html>
